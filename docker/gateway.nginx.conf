# Local stand-in for the Kubernetes ingress:
#   /api/*  -> backend (prefix stripped)    /  -> frontend

# Only WebSocket upgrades (socket.io) are allowed through. Forwarding any client
# Upgrade value would allow h2c request smuggling past the proxy.
map $http_upgrade $ws_upgrade {
    default   "";
    websocket websocket;
}
map $http_upgrade $connection_upgrade {
    default   close;
    websocket upgrade;
}

server {
    listen 80;

    location /api/ {
        # The trailing slash on proxy_pass strips the /api/ prefix.
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        # WebSocket (socket.io) upgrade support. Reviewed: $ws_upgrade is only ever
        # "websocket" or empty (map above), which is the rule's own mitigation; the
        # pattern-based rule cannot evaluate the map.
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
