# Dependabot opens PRs (into develop, so they follow the normal flow) when
# dependencies, base images or pinned actions have updates or security fixes.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/backend", "/frontend"]
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
