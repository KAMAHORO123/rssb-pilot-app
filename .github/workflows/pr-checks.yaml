# Runs on every pull request into develop, qa or main.
# Answers one question: "is this change safe to merge?" Nothing is published.
#
#   test            format, lint, typecheck, unit tests, build (backend + frontend)
#   secret-scan     Gitleaks over the full git history
#   sast            CodeQL static analysis of our TypeScript source
#   dockerfile-lint Hadolint on every Dockerfile
#   image-scan      build each image and scan it with Trivy (CRITICAL blocks)
#
# Every third-party action is pinned to a full commit SHA (tags can be moved).

name: PR checks

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

# Least privilege: read-only unless a job asks for more.
permissions:
  contents: read

# A new push to the same PR cancels the previous, now outdated, run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  test:
    name: test (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      # `npm ci` installs exactly what the lockfile says (npm install may change it).
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted later is still leaked
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --redact --verbose

  sast:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload findings to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  dockerfile-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hadolint
        run: |
          for f in docker/*.Dockerfile; do
            echo "::group::$f"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/hadolint.yaml:ro" \
              "$HADOLINT_IMAGE" hadolint --config /hadolint.yaml - < "$f"
            echo "::endgroup::"
          done

  image-scan:
    name: image-scan (${{ matrix.image.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: backend, context: backend, dockerfile: docker/backend.Dockerfile, target: runtime }
          - { name: backend-migrator, context: backend, dockerfile: docker/backend.Dockerfile, target: migrator }
          - { name: frontend, context: frontend, dockerfile: docker/frontend.Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          load: true
          tags: scan/${{ matrix.image.name }}:pr
          cache-from: type=gha,scope=${{ matrix.image.name }}-amd64
      - name: Trivy report (HIGH + CRITICAL, informational)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE" image \
            --ignorefile /.trivyignore --ignore-unfixed --severity HIGH,CRITICAL \
            scan/${{ matrix.image.name }}:pr
      - name: Trivy gate (CRITICAL blocks the merge)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE" image \
            --ignorefile /.trivyignore --ignore-unfixed --severity CRITICAL \
            --exit-code 1 --quiet scan/${{ matrix.image.name }}:pr
