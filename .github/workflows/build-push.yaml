# Runs after a merge into develop, qa or main.
#
# "Build once, promote the same image":
#   develop -> build, scan, push to GHCR, sign          -> UAT
#   qa      -> NO build: reuse the image built on develop -> staging
#   main    -> NO build: reuse the image built on develop -> production (manual sync)
#
# Images are tagged by the git TREE hash (a hash of the file contents), not the
# commit hash. Merging develop into qa creates a new commit but an identical
# tree, so qa finds exactly the image that was built and tested on develop.
# If no such image exists, qa/main contain code UAT never saw, and we fail.

name: Build and publish

on:
  push:
    branches: [develop, qa, main]

permissions:
  contents: read

# Never cancel a publish half-way; queue instead.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      environment: ${{ steps.meta.outputs.environment }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        name: Compute tag and target environment
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          case "$GITHUB_REF_NAME" in
            develop) env=uat ;;
            qa)      env=staging ;;
            main)    env=production ;;
          esac
          {
            echo "tag=tree-${tree:0:12}"
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "environment=$env"
            echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}"  # GHCR names must be lowercase
          } | tee -a "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        name: Do images for this exact content already exist?
        env:
          PREFIX: ${{ steps.meta.outputs.image_prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          missing=0
          for img in backend backend-migrator frontend; do
            if docker buildx imagetools inspect "$PREFIX/$img:$TAG" > /dev/null 2>&1; then
              echo "found   $PREFIX/$img:$TAG"
            else
              echo "missing $PREFIX/$img:$TAG"; missing=1
            fi
          done
          if [ "$missing" = 0 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = develop ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No image for tree $TAG. Code must reach $GITHUB_REF_NAME through develop (UAT) first."
            exit 1
          fi

  # One job per image per CPU architecture, each on a native runner.
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: build (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - { name: backend, context: backend, dockerfile: docker/backend.Dockerfile, target: runtime }
          - { name: backend-migrator, context: backend, dockerfile: docker/backend.Dockerfile, target: migrator }
          - { name: frontend, context: frontend, dockerfile: docker/frontend.Dockerfile, target: runtime }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }      # RSSB servers
          - { arch: arm64, runner: ubuntu-24.04-arm }  # Apple Silicon (local minikube)
    env:
      IMAGE: ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: scan/${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Trivy gate (CRITICAL blocks the publish)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE" image \
            --ignorefile /.trivyignore --ignore-unfixed --severity CRITICAL \
            --exit-code 1 scan/${{ matrix.image.name }}:ci

      # Same build again (fully cached), now pushed by digest only. The merge
      # job below stitches the amd64 + arm64 digests into one multi-arch tag.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image.name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests_${{ matrix.image.name }}_${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # Create the multi-arch tag and sign it.
  publish:
    needs: [prepare, build]
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless Cosign signing via GitHub's OIDC identity
    strategy:
      matrix:
        image: [backend, backend-migrator, frontend]
    env:
      IMAGE: ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA_TAG: sha-${{ needs.prepare.outputs.short_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests_${{ matrix.image }}_*  # "_" so "backend" does not also match "backend-migrator"
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create multi-arch tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:$SHA_TAG" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
      - name: Sign with Cosign (keyless)
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"
          echo "Signed $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [prepare, publish]
    # Runs after a fresh build (develop) or straight away when reusing (qa/main).
    if: always() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.publish.result)
    runs-on: ubuntu-24.04
    steps:
      - name: Record the release for this environment
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREFIX: ${{ needs.prepare.outputs.image_prefix }}
        run: |
          {
            echo "### $ENVIRONMENT should now run \`$TAG\`"
            echo ""
            for img in backend backend-migrator frontend; do echo "- \`$PREFIX/$img:$TAG\`"; done
            echo ""
            echo "_TODO (Phase 4): write this tag into values-$ENVIRONMENT.yaml in the config repo._"
          } >> "$GITHUB_STEP_SUMMARY"
